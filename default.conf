# Static site, unprivileged nginx (listens 8080 as uid 101, never root).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;          # no nginx version in Server: / error pages
    autoindex off;              # never list a directory
    charset utf-8;

    # NOTE: every add_header lives at SERVER level on purpose. nginx does not
    # inherit add_header into any block that declares its own — an earlier
    # `location = /index.html { add_header Cache-Control ...; }` silently
    # stripped the entire security header set from the one page that matters,
    # because `/` internally redirects to /index.html. Do not add a bare
    # add_header inside a location without repeating all of these.
    #
    # This page is fully self-contained: no third-party scripts, fonts, images,
    # analytics, or XHR. default-src 'none' means an injected <script src=evil>
    # or fetch() cannot load at all. Inline script/style are NOT permitted
    # either (hence separate app.js/style.css), so even a successful HTML
    # injection cannot execute JavaScript.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;

    # Dotfiles are never served (no .git, .env, .DS_Store, editor backups).
    location ~ /\. { deny all; access_log off; return 404; }
    location ~ ~$  { deny all; access_log off; return 404; }

    location = /healthz { access_log off; return 200 "ok\n"; }

    location / {
        limit_except GET HEAD { deny all; }   # no POST/PUT/DELETE/TRACE
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
}
